# SYNTH_V2 exposure store · basket: margin_trap
# paints / tyres / electricals — RM-cost margin-at-risk screen (first fixture).
#
# REDESIGN IN PROGRESS (EXPOSURE_REDESIGN_AUDIT.md): rm_to_sales and
# inventory_days now come from fetch_fundamentals (vintage-keyed, quality:
# derived), NOT hand-curated YAML. This file is the ticker-mapping + input-basket
# config; the value-fields become fetched at Step 3 (three-way split). Sentinels
# below remain fail-closed until that wiring lands — never fabricated.
#
# `ticker` per name is the mapping config (owner ruling: not inline in the
# fetcher, so a symbol mismatch surfaces as a lookup failure — CEAT is CEATLTD.NS,
# never CEAT.NS which reads as delisted).
# input_basket COMPONENTS are the recoverable sector->input mapping; component
# WEIGHTS migrate to model-config at Step 3 (a modelling choice, not a fact).

basket: margin_trap
description: paints / tyres / electricals — RM-cost margin-at-risk screen
updated: null
reporting_cycle_days: 100
require_input_basket: true
required_fields: [rm_to_sales, inventory_days]
value_ranges:
  rm_to_sales: {min: 0, max: 1}    # 0-1 ratio; a % slip fails closed

model:                             # modelling choices (config, not measured)
  inventory_dampener: "90 / (90 + inventory_days)"
  applicability_haircut: 0.75

_sentinel: &sentinel {value: null, as_of: null, source: null, quality: null}

names:
  # --- tyres: rubber + crude (carbon black) --------------------------------
  ceat:
    ticker: CEATLTD.NS
    sector: tyres
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: wpi_rubber, weight: *sentinel}, {series: brent, weight: *sentinel}]
  mrf:
    ticker: MRF.NS
    sector: tyres
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: wpi_rubber, weight: *sentinel}, {series: brent, weight: *sentinel}]
  apollo:
    ticker: APOLLOTYRE.NS
    sector: tyres
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: wpi_rubber, weight: *sentinel}, {series: brent, weight: *sentinel}]

  # --- paints: TiO2 (coarse chemicals, proxy) + crude-derived solvents ------
  asian_paints:
    ticker: ASIANPAINT.NS
    sector: paints
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: wpi_chemicals, weight: *sentinel}, {series: brent, weight: *sentinel}]
  berger:
    ticker: BERGEPAINT.NS
    sector: paints
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: wpi_chemicals, weight: *sentinel}, {series: brent, weight: *sentinel}]
  kansai:
    ticker: KANSAINER.NS
    sector: paints
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: wpi_chemicals, weight: *sentinel}, {series: brent, weight: *sentinel}]

  # --- electricals / cooling: copper + basic metals (aluminium / steel) -----
  havells:
    ticker: HAVELLS.NS
    sector: electricals
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: comex_copper, weight: *sentinel}, {series: wpi_basic_metals, weight: *sentinel}]
  polycab:
    ticker: POLYCAB.NS
    sector: electricals
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: comex_copper, weight: *sentinel}, {series: wpi_basic_metals, weight: *sentinel}]
  bluestar:
    ticker: BLUESTARCO.NS
    sector: electricals
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: comex_copper, weight: *sentinel}, {series: wpi_basic_metals, weight: *sentinel}]
  voltas:
    ticker: VOLTAS.NS
    sector: electricals
    fields: {rm_to_sales: *sentinel, inventory_days: *sentinel}
    input_basket:
      components: [{series: comex_copper, weight: *sentinel}, {series: wpi_basic_metals, weight: *sentinel}]
